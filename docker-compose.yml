services:
  db:
    container_name: house-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: house_db
    ports:
      - "127.0.0.1:5433:5432"  # Changed from 5432 to avoid conflict
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  house-server:
    container_name: house-server
    build:
      context: ./server
      dockerfile: dockerfile
    ports:
      - "3000:3000"
      - "4000:4000"   # <-- Add this line to expose port 4000
    volumes:
      - C:\Users\NicoD\Desktop\temp:/usr/src/app/disk
      - ./.env:/usr/src/app/.env
    depends_on:
      - db
    networks:
      - internal
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - CERT_PATH=${CERT_PATH}
      - BASE_URL=${BASE_URL}

  signaler:
    container_name: house-signaler
    build:
      context: ./signaler
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=house_db
    depends_on:
      - db
    networks:
      - internal
    restart: unless-stopped

  house-client:
    container_name: house-client
    build:
      context: ./houseClient
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
      - EXPO_PUBLIC_API_BASE_URL=http://localhost:8080
    networks:
      - internal
    depends_on:
      - signaler
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
