services:
  db:
    container_name: house-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: house_db
    ports:
      - "127.0.0.1:5433:5432"  # Changed from 5432 to avoid conflict
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  house-server:
    container_name: house-server
    build:
      context: ./server
      dockerfile: dockerfile
    ports:
      - "3000:3000"
      - "4000:4000"   # <-- Expose port 4000 for onboarding
    volumes:
      - C:\Users\NicoD\Desktop\temp:/usr/src/app/disk
      - ./.env:/usr/src/app/.env
    depends_on:
      signaler:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - CERT_PATH=${CERT_PATH}
      - BASE_URL=${BASE_URL}
      - SIGNALER_WS_URL=ws://house-signaler:8080
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/files"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  signaler:
    container_name: house-signaler
    build:
      context: ./signaler
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=house_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
